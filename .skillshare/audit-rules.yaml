# Project-level audit rule calibration for this skills repository.
# Applies to `skillshare audit` runs from this checkout.
#
# data-exfiltration-3 ("Potential DNS data exfiltration via encoded subdomain")
# fires on ordinary technical prose containing dotted identifiers in backticks,
# e.g. `raw.idmap`, `<instance>.<dns.domain>`, `listen=tcp:0.0.0.0:8080`,
# `machine-id`. Every match audited in this repo so far is documentation of
# legitimate Incus syntax, not an encoded payload. Downgrading the pattern group
# keeps matches visible as LOW advisories without inflating the aggregate risk
# score. Re-enable severity if a genuine encoded-subdomain finding ever appears.
rules:
  - pattern: data-exfiltration
    severity: LOW
